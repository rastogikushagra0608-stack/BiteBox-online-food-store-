name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root
        ports: ["3306:3306"]
        options: --health-cmd="mysqladmin ping -pci-root" --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      BITEBOX_TEST_CONNECTION: "Server=127.0.0.1;Port=3306;Database=bitebox_test;User=root;Password=ci-root;"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json
      - run: dotnet test backend/BiteBox.sln --configuration Release

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/bitebox-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/bitebox-web/package-lock.json
      - run: npm ci
      - run: npx ng test --watch=false
      - run: npx ng build
